name: Build and Push Worker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.worker'
      - 'backend/requirements.txt'
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: build-worker-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Headless Worker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (lowercase tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reelmob-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
