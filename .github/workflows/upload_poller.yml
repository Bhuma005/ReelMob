name: Automator Upload Poller

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'
  
  # Allow manual triggering from the GitHub Actions UI for testing
  workflow_dispatch:

concurrency:
  # Prevent multiple poller instances from running concurrently
  group: upload-poller
  cancel-in-progress: false

jobs:
  poll_and_upload:
    name: Poll Pending Videos and Upload
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent runs

      - name: Install dependencies
        run: |
          # Only installing what's needed for the cloud worker
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib supabase
          
      - name: Run Upload Workflow
        env:
          # Injected into the runner safely via GitHub Actions Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python -m cloud.workflow_upload
