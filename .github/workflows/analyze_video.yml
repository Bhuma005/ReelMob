name: Analyze Video Worker (GHCR Container Offload)

on:
  repository_dispatch:
    types: [analyze-video]

jobs:
  analyze:
    name: Heavy Video Frame & AI Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/bhuma005/reelmob-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Video Analysis Worker
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python backend/scripts/run_analysis_job.py
